services:
  server-vpn:
    build:
      context: ../
      dockerfile: ./docker/server.Dockerfile
    container_name: vpn-server
    working_dir: /app
    privileged: true
    command: ./udptun serve
    networks:
      shared_l3_net:
        ipv4_address: 10.100.1.1

  clinet-a:
    build: 
      context: ../
      dockerfile: ./docker/client-a.Dockerfile
    container_name: clinet-a
    privileged: true
    working_dir: /app
    depends_on:
      - server-vpn
    command: ./udptun client -r 10.100.1.1  -p 9999 -s 8888 -t 10.30.1.2/24 -k ClientKey001
    networks:
      shared_l3_net:
        ipv4_address: 172.16.222.2

#   clinet-b:
#     image: busybox
#     container_name: clinet-b
#     command: sleep infinity
#     networks:
#       shared_l3_net:
#         ipv4_address: 172.18.111.2
networks:
  shared_l3_net:
    driver: ipvlan
    driver_opts:
      parent: enp42s0
      ipvlan_mode: l3
    ipam:
      config:
        - subnet: 10.100.1.0/24 # server-vpn
        - subnet: 172.16.222.0/24 # clinet-a
        # - subnet: 172.18.111.0/24 # clinet-b

